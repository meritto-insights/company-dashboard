<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Insights</title>
<style>
  :root{
    --navy:#0d1b3f; --brand:#4437B8; --brand-soft:#f2f0ff; --bg:#f6f7fb; --card:#ffffff;
    --text:#1e2235; --muted:#6b7188; --border:#e3e5ef;
    /* health tags: background / ink */
    --red-bg:#fdecec; --red:#b42318; --amber-bg:#fff4e5; --amber:#a15c07; --blue-bg:#eaf2ff; --blue:#1d4ed8;
    --green-bg:#e8f7ef; --green:#137a46; --grey-bg:#f0f1f5; --grey:#4b5163; --purple-bg:#f3ecff; --purple:#6b3fb8;
    --teal-bg:#e6f6f4; --teal:#0f766e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  .wrap{padding:20px 24px 48px}
  .topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .topline h1{font-size:20px;font-weight:800;color:#26215c;letter-spacing:-.01em}
  .chip{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:6px 14px;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:#c6befc;background:#fbfaff}
  .sample{background:#fff7e6;border:1px solid #f0e0bb;color:#7a5a12;border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:14px}

  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:18px}
  .section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}

  /* What happened band */
  .hero{background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px 12px;margin-bottom:18px}
  .hero .eyebrow{font-size:15px;font-weight:700;color:#fff;margin-bottom:8px}
  .numbers{width:100%;border-collapse:separate;border-spacing:0;background:rgba(255,255,255,.06);border-radius:10px;overflow:hidden}
  .numbers th{color:rgba(255,255,255,.6);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid rgba(255,255,255,.12);padding:9px 14px;text-align:left}
  .numbers td{color:#fff;font-size:15px;font-weight:600;border-bottom:none;padding:10px 14px}
  .numbers td small{display:block;font-size:11.5px;font-weight:400;color:rgba(255,255,255,.6)}
  .up{color:#6ee7a8} .down{color:#ff9b8f}
  .verdict{font-size:16px;font-weight:600;line-height:1.45;color:#fff;margin:0 2px 12px}
  .verdict .bulb{margin-right:6px}
  /* Seat-use zones */
  .zones{margin-top:12px}
  .zones .zt{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.6);font-weight:600;margin-bottom:6px}
  .zbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08)}
  .zbar span{display:block;height:100%}
  .zlegend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;margin-top:8px;font-size:12.5px;color:rgba(255,255,255,.85)}
  .zlegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .zlegend b{color:#fff}
  .zlegend small{color:rgba(255,255,255,.55);margin-left:4px}
  .z-risk{background:#ff8a7a} .z-watch{background:#ffcf70} .z-health{background:#5fdc9c} .z-expand{background:#8fb8ff}

  /* Weak | Strong toggle */
  .sides{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .side{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);background:var(--card);border-radius:12px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:var(--muted)}
  .side .n{font-size:18px;font-weight:800}
  .side:hover{border-color:#c6befc}
  .side.weak.on{border-color:var(--red);background:var(--red-bg);color:var(--red)}
  .side.strong.on{border-color:var(--green);background:var(--green-bg);color:var(--green)}
  .side.check.on{border-color:var(--purple);background:var(--purple-bg);color:var(--purple)}
  .side .dot{width:10px;height:10px;border-radius:50%;background:currentColor}

  /* One line per insight */
  .lines{display:flex;flex-direction:column}
  .line{display:grid;grid-template-columns:56px auto auto auto 1fr;justify-content:start;align-items:center;gap:14px;padding:9px 4px;border-top:1px solid #eff0f5}
  .line:first-child{border-top:none}
  .line .cnt{font-size:20px;font-weight:800;text-align:right}
  .weak-side .cnt{color:var(--red)} .strong-side .cnt{color:var(--green)} .check-side .cnt{color:var(--purple)}
  .line .txt{font-size:14px;color:var(--text)}
  .line .stake{font-size:12px;color:var(--grey);background:var(--grey-bg);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .line .stake b{color:var(--text)}
  .zp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .zp i{width:8px;height:8px;border-radius:50%}
  .zp.risk i{background:#e5484d} .zp.watch i{background:#e5a00d} .zp.health i{background:#1f9d5a} .zp.expand i{background:#3b73e0}
  .rank{color:var(--muted);font-weight:700;width:28px}
  /* Tips: ⓘ next to anything with a rule behind it */
  .ti{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:10.5px;font-weight:800;font-style:normal;
    color:var(--muted);border:1.3px solid currentColor;cursor:help;margin-left:6px;vertical-align:1px;line-height:1;user-select:none}
  .ti:hover,.ti.on{color:var(--brand)}
  .hero .ti{color:rgba(255,255,255,.6)} .hero .ti:hover{color:#fff}
  [data-tip]{cursor:help}
  #tipBox{position:fixed;z-index:100;max-width:300px;background:#1e2235;color:#fff;font-size:12.5px;line-height:1.45;border-radius:10px;padding:9px 12px;
    box-shadow:0 10px 30px rgba(13,27,63,.25);pointer-events:none;opacity:0;transition:opacity .12s}
  #tipBox.on{opacity:1}
  .line .see{font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:none;border-radius:8px;cursor:pointer;padding:5px 10px;font-family:inherit;white-space:nowrap}
  .line .see:hover{background:#e8e4ff}
  .line.focus{background:#fbfaff}
  ul.spot{list-style:none;display:flex;flex-direction:column}
  ul.spot li{position:relative;padding:9px 4px 9px 22px;border-top:1px solid #eff0f5;font-size:14px;line-height:1.5}
  ul.spot li:first-child{border-top:none}
  ul.spot li::before{content:"";position:absolute;left:6px;top:16px;width:8px;height:8px;border-radius:50%}
  .weak-side ul.spot li::before{background:var(--red)} .strong-side ul.spot li::before{background:var(--green)}
  ul.spot .see{margin-left:8px;font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:none;border-radius:8px;cursor:pointer;padding:3px 9px;font-family:inherit;white-space:nowrap}
  ul.spot .see:hover{background:#e8e4ff}
  .warn{background:#fff7e6;border:1px solid #f0e0bb;color:#7a5a12;border-radius:10px;padding:10px 12px;font-size:13px}
  th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--brand)}
  tr.row.hl td{background:#fff4c2 !important;transition:background .4s}
  .inst-l{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}

  /* Health table */
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
  .fchip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--text)}
  .fchip.active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
  .fchip b{font-weight:700}
  .search{border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:13px;min-width:200px;font-family:inherit}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  th.num,td.num{text-align:right}
  td{padding:10px;border-bottom:1px solid #eff0f5;vertical-align:top}
  tr.row{cursor:pointer}
  tr.row:hover td{background:#fbfaff}
  .acct{font-weight:600}
  .acct .caret{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
  tr.open .caret{transform:rotate(90deg)}
  .why{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .t-red{background:var(--red-bg);color:var(--red)} .t-amber{background:var(--amber-bg);color:var(--amber)}
  .t-blue{background:var(--blue-bg);color:var(--blue)} .t-green{background:var(--green-bg);color:var(--green)}
  .t-grey{background:var(--grey-bg);color:var(--grey)} .t-purple{background:var(--purple-bg);color:var(--purple)}
  .t-teal{background:var(--teal-bg);color:var(--teal)}
  tr.people td{background:#fafbfd;padding:12px 16px 14px 34px}
  .people-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
  .people-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px;font-size:13px}
  .people-list .p-state{font-size:11px;color:var(--muted)}
  .more{margin-top:12px;text-align:center}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}

  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 16px;text-align:center;gap:10px;color:var(--muted)}
  .spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:760px){
    .numbers-wrap{overflow-x:auto}
    .line{grid-template-columns:44px minmax(0,1fr);gap:4px 12px}
    .line .see,.line .stake{grid-column:2;justify-self:start}
    .hide-sm{display:none}
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="state"><div class="spinner"></div><p>Reading the latest data…</p></div>
</div>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  // Apps Script web-app URL of the Insights service (Insights.gs)
  ENDPOINT: "https://script.google.com/macros/s/AKfycbzZ2PhbIwnRJXCey6H-ZqUaignm-CoqqKP39GVwAMH31o3OhK3dmcPsAiXqQ8b8wYQL7A/exec",
  TITLES: { users: "Users Insights" },
  PAGE_SIZE: 10
};

const TAG_STYLE = {
  gone_silent:   { cls: "t-red",    label: "Gone silent" },
  key_user:      { cls: "t-red",    label: "Admin gone quiet" },
  sharp_drop:    { cls: "t-amber",  label: "Sharp drop" },
  never_started: { cls: "t-grey",   label: "Never took off" },
  low_util:      { cls: "t-amber",  label: "Low utilisation" },
  unused_seats:  { cls: "t-grey",   label: "Unused seats" },
  over_limit:    { cls: "t-blue",   label: "Over limit" },
  strength:      { cls: "t-green",  label: "Strength" },
  rising:        { cls: "t-green",  label: "Rising" },
  back:          { cls: "t-teal",   label: "Back in action" },
  data_check:    { cls: "t-purple", label: "Data check" },
  slipping:      { cls: "t-red",    label: "Slipping vs season" },
  sliding:       { cls: "t-red",    label: "3-month slide" },
  shrinking:     { cls: "t-amber",  label: "Smaller than last year" },
  beat_season:   { cls: "t-green",  label: "Beating season" },
  climbing:      { cls: "t-green",  label: "Climbing" },
  grown:         { cls: "t-teal",   label: "Bigger than last year" }
};
const SIDES = {
  weak:   { label: "Negatives",   tags: ["gone_silent", "slipping", "sliding", "shrinking", "key_user", "sharp_drop", "never_started", "low_util", "unused_seats"] },
  strong: { label: "Positives", tags: ["beat_season", "climbing", "grown", "strength", "over_limit", "rising", "back"] },
  check:  { label: "Data check",     tags: ["data_check"] }
};

/* ================= PARAMS ================= */
const qs = new URLSearchParams(location.search);
const P = {
  dashboard: (qs.get("dashboard") || "users").toLowerCase(),
  viewer: qs.get("viewer") || "",
  key: qs.get("key") || "",
  demo: qs.get("demo") === "1" || !CONFIG.ENDPOINT
};

/* ================= HELPERS ================= */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Math.round(Number(n) || 0).toLocaleString("en-IN");
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
function delta(now, then){
  if (!then) return { txt: "—", cls: "" };
  const d = Math.round((now / then - 1) * 100);
  return { txt: (d > 0 ? "▲ +" : d < 0 ? "▼ −" : "") + Math.abs(d) + "%", cls: d > 0 ? "up" : d < 0 ? "down" : "" };
}
// Seat-use zones (active / seats), same bands as the engine
const ZONE_LABEL = { risk: "Churn risk", watch: "Watch", health: "Healthy", expand: "Expansion signal" };
const zoneOfPct = p => p == null || isNaN(p) ? "" : p < 50 ? "risk" : p < 60 ? "watch" : p < 90 ? "health" : "expand";
function zonesHtml(zones){
  if (!zones || !zones.length) return "";
  const total = zones.reduce((s, z) => s + z.count, 0) || 1;
  return '<div class="zones"><div class="zt">Seat use across accounts</div>' +
    '<div class="zbar">' + zones.map(z => '<span class="z-' + z.id + '" style="width:' + (z.count * 100 / total) + '%" title="' + esc(z.label + ": " + z.count) + '"></span>').join("") + '</div>' +
    '<div class="zlegend">' + zones.map(z => '<span' + (z.tip ? ' data-tip="' + esc(z.tip) + '"' : "") + '><i class="z-' + z.id + '"></i>' + esc(z.label) + ' <b>' + fmt(z.count) + '</b><small>' + esc(z.range) + '</small></span>').join("") + (zones[0].tip ? tipI("Each account's active users as a % of its paid seats.") : "") + '</div></div>';
}
// ⓘ icon with a rule behind it
const tipI = t => '<i class="ti" tabindex="0" data-tip="' + esc(t) + '">i</i>';
// One floating tip for the whole page: hover on desktop, tap on phones
(function(){
  const box = document.createElement("div"); box.id = "tipBox"; document.body.appendChild(box);
  let cur = null;
  const show = el => {
    cur = el; box.textContent = el.getAttribute("data-tip"); box.classList.add("on");
    const r = el.getBoundingClientRect(), w = Math.min(300, window.innerWidth - 24);
    box.style.left = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 12)) + "px";
    box.style.top = (r.bottom + 8 + box.offsetHeight > window.innerHeight ? r.top - box.offsetHeight - 8 : r.bottom + 8) + "px";
  };
  const hide = () => { cur = null; box.classList.remove("on"); };
  document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); if (el) show(el); else if (cur) hide(); });
  document.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); if (el) show(el); });
  document.addEventListener("click", e => { const el = e.target.closest("[data-tip]"); if (el) show(el); else hide(); });
  window.addEventListener("scroll", hide, true);
})();
function zonePill(a){
  if (a.pct == null) return '<span class="why">—</span>';
  return '<span class="zp ' + esc(a.zone) + '" title="' + esc(ZONE_LABEL[a.zone] || "") + '"><i></i>' + a.pct + '%</span>';
}
// In the weak view an account whose admin went quiet, but whose own tag is not weak, shows as "Admin gone quiet"
const shownTag = a => (side === "weak" && SIDES.weak.tags.indexOf(a.tag) === -1 && a.keyUserQuiet) ? "key_user" : a.tag;
function pill(tag){
  const s = TAG_STYLE[tag] || { cls: "t-grey", label: tag };
  const t = DATA && DATA.tips && DATA.tips[tag];
  return '<span class="pill ' + s.cls + '"' + (t ? ' data-tip="' + esc(t) + '"' : "") + '><span class="dot"></span>' + esc(s.label) + '</span>';
}
function api(params){
  const u = new URL(CONFIG.ENDPOINT);
  Object.entries(Object.assign({ dashboard: P.dashboard, viewer: P.viewer, key: P.key }, params || {}))
    .forEach(([k, v]) => u.searchParams.set(k, v));
  return fetch(u.toString()).then(r => r.json());
}
function loadDemo(){
  return new Promise((resolve, reject) => {
    if (window.INSIGHTS_DEMO) return resolve(window.INSIGHTS_DEMO);
    const s = document.createElement("script");
    s.src = "insights-demo.js";
    s.onload = () => window.INSIGHTS_DEMO ? resolve(window.INSIGHTS_DEMO) : reject(new Error("Demo data missing"));
    s.onerror = () => reject(new Error("insights-demo.js not found next to this page"));
    document.head.appendChild(s);
  });
}

/* ================= STATE ================= */
let DATA = null;
let side = "strong"; // Positives open first
let filterTag = null, searchText = "", shown = CONFIG.PAGE_SIZE;
let sortKey = null, sortDir = 1; // null = ranked order from the engine
let focus = null; // { id, iids:Set, label } when "See" was clicked on an insight line
const openRows = new Set();
const peopleCache = {};

/* ================= LOAD ================= */
(async function init(){
  const app = document.getElementById("app");
  try {
    if (P.dashboard !== "users") throw new Error("Insights for this dashboard are coming soon.");
    if (!P.demo && (!P.viewer || !P.key)){
      app.innerHTML = '<div class="state"><h2 style="color:var(--text);font-size:17px">Open Insights from Pulse 2.0</h2>' +
        '<p>This page shows each person only their own accounts, so it needs to be opened from the dashboard: ' +
        'Pulse 2.0 → Users ▾ → ✨ Insights.</p></div>';
      return;
    }
    DATA = P.demo ? (await loadDemo()).payload : await api();
    if (!DATA || DATA.error) throw new Error((DATA && DATA.error) || "No data");
    if (!DATA.counts) throw new Error("The Insights service is on an older version. Redeploy Insights.gs.");
    render();
  } catch(e){
    app.innerHTML = '<div class="state"><h2 style="color:var(--text);font-size:17px">Insights unavailable</h2><p>' + esc(e.message) + '</p></div>';
  }
})();

/* ================= RENDER ================= */
function render(){
  const d = DATA, k = d.kpis;
  const vsLy = delta(k.active, k.lastYear), vsPrev = delta(k.active, k.prev);
  const scope = d.scope.all ? "All institutes" : "Your " + d.scope.institutes + " institute" + (d.scope.institutes === 1 ? "" : "s");
  document.getElementById("app").innerHTML =
    (P.demo ? '<div class="sample">Preview with sample data. The live version covers every account you own.</div>' : "") +
    '<div class="topline">' +
      '<h1>' + esc(CONFIG.TITLES[d.dashboard] || "Insights") + ' · ' + esc(d.month) + '</h1>' +
      '<span class="chip">Data as of the monthly upload</span>' +
      '<span class="chip">' + esc(scope) + '</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn" id="copyBtn">Copy summary</button>' +
    '</div>' +

    '<div class="hero">' +
      '<div class="eyebrow">What happened in ' + esc(d.month) + '</div>' +
      (d.verdict ? '<div class="verdict"><span class="bulb">💡</span>' + esc(d.verdict) + '</div>' : "") +
      '<div class="numbers-wrap"><table class="numbers"><thead><tr>' +
        '<th>Seats</th><th>Enabled</th><th>Active (' + esc(d.monthShort) + ')</th><th>vs last ' + esc(d.monthShort) + '</th><th>vs ' + esc(d.prevMonth) + '</th>' +
      '</tr></thead><tbody><tr>' +
        '<td>' + fmt(k.seats) + '</td>' +
        '<td>' + fmt(k.enabled) + '<small>' + pct(k.enabled, k.seats) + '% of seats</small></td>' +
        '<td>' + fmt(k.active) + '<small>' + pct(k.active, k.seats) + '% of seats' + (zoneOfPct(pct(k.active, k.seats)) ? ' · ' + ZONE_LABEL[zoneOfPct(pct(k.active, k.seats))].toLowerCase() + ' zone' : "") + '</small></td>' +
        '<td><span class="' + vsLy.cls + '">' + vsLy.txt + '</span><small>' + fmt(k.lastYear) + ' a year ago</small></td>' +
        '<td><span class="' + vsPrev.cls + '">' + vsPrev.txt + '</span><small>' + esc(d.seasonNote || "") + '</small></td>' +
      '</tr></tbody></table></div>' +
      zonesHtml(d.zones) +
    '</div>' +

    '<div class="card">' +
      '<div class="sides" id="sides"></div>' +
      '<div class="lines" id="lines"></div>' +
    '</div>' +

    '<div class="card" id="healthCard">' +
      '<div class="section-title" id="healthTitle"></div>' +
      '<div class="filters" id="filters"></div>' +
      '<div class="tbl-wrap"><table><thead><tr>' +
        '<th class="rank">S.No</th>' + sortTh("iid", "Institute ID") + sortTh("name", "Institute name") + sortTh("health", "Health") +
        '<th class="hide-sm">Why</th>' + sortTh("pct", "Seat use") +
        sortTh("seats", "Seats", "num") + sortTh("enabled", "Enabled", "num") + sortTh("active", "Active", "num") +
      '</tr></thead><tbody id="tbody"></tbody></table></div>' +
      '<div class="more" id="more"></div>' +
    '</div>' +
    '<div class="foot">' + (d.scope.all ? "Showing every institute." : "Showing only the institutes you own as CS SPOC, Manager or Head.") +
      ' Healthy and small accounts are not listed.</div>';

  document.getElementById("copyBtn").onclick = copySummary;
  document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = (k === "name" || k === "health" || k === "iid") ? 1 : -1; }
    shown = CONFIG.PAGE_SIZE; renderTable(); markSort();
  });
  renderSide();
}
function sortTh(k, label, cls){
  return '<th class="sortable' + (cls ? " " + cls : "") + '" data-sort="' + k + '" title="Click to sort">' + esc(label) + '<span class="sa"></span></th>';
}
function markSort(){
  document.querySelectorAll("th[data-sort]").forEach(th => {
    th.querySelector(".sa").textContent = th.dataset.sort === sortKey ? (sortDir > 0 ? " ▲" : " ▼") : "";
  });
}

function renderSide(){
  const d = DATA;
  const sides = ["strong", "weak"].concat(d.counts.check ? ["check"] : []);
  document.getElementById("sides").innerHTML = sides.map(s =>
    '<button class="side ' + s + (side === s ? " on" : "") + '" data-side="' + s + '"><span class="dot"></span>' +
    esc(SIDES[s].label) + ' <span class="n">' + fmt(d.counts[s]) + '</span></button>').join("");
  document.querySelectorAll(".side").forEach(b => b.onclick = () => {
    side = b.dataset.side; filterTag = null; focus = null; searchText = ""; shown = CONFIG.PAGE_SIZE;
    renderSide();
  });
  document.getElementById("healthTitle").textContent = "Institute-wise analysis";
  renderLines();
  renderFilters();
  renderTable();
}

// Spotlight: the few named accounts that matter most. One account = See ↓ jumps to its row; several = no arrow.
function renderLines(){
  const el = document.getElementById("lines");
  el.className = "lines " + side + "-side";
  if (side === "weak" && DATA.dataSuspect){
    el.innerHTML = '<p class="warn">⚠ This month\'s data looks incomplete (all accounts together are far below their usual level), so no accounts are named. Check the monthly upload.</p>';
    return;
  }
  const list = (DATA.spotlight || []).filter(b => b.side === side);
  if (!list.length){ el.innerHTML = '<p class="why" style="padding:6px 4px">Nothing critical to call out this month.</p>'; return; }
  el.innerHTML = '<ul class="spot">' + list.map((b, i) =>
    '<li>' + esc(b.text) + (b.iids.length === 1 ? ' <button class="see" data-i="' + i + '">See ↓</button>' : "") + '</li>').join("") + '</ul>';
  el.querySelectorAll(".see").forEach(btn => btn.onclick = () => jumpTo(list[+btn.dataset.i].iids[0]));
}
// Show the account's row in the table (clearing filters if needed) and flash it
function jumpTo(iid){
  filterTag = null; focus = null; searchText = ""; sortKey = null; sortDir = 1;
  const inst = document.getElementById("inst"); if (inst) inst.value = "";
  const idx = filteredAccounts().findIndex(a => a.iid === iid);
  if (idx === -1) return;
  shown = Math.max(shown, idx + 1);
  renderFilters(); renderTable(); markSort();
  const tr = document.querySelector('tr.row[data-iid="' + CSS.escape(iid) + '"]');
  if (!tr) return;
  tr.scrollIntoView({ behavior: "smooth", block: "center" });
  tr.classList.add("hl"); setTimeout(() => tr.classList.remove("hl"), 2600);
}

function sideAccounts(){ return DATA.accounts.filter(a => a.side === side); }

function renderFilters(){
  const all = sideAccounts();
  const counts = {};
  all.forEach(a => { const t = shownTag(a); if (t !== "key_user") counts[t] = (counts[t] || 0) + 1; });
  counts.key_user = all.filter(a => a.keyUserQuiet).length; // every admin-quiet account, same as its insight line
  const el = document.getElementById("filters");
  let html = '<button class="fchip' + (!filterTag && !focus ? " active" : "") + '" data-tag="">All <b>' + fmt(all.length) + '</b></button>';
  SIDES[side].tags.forEach(t => {
    if (!counts[t]) return;
    html += '<button class="fchip' + (filterTag === t ? " active" : "") + '" data-tag="' + t + '">' + esc(TAG_STYLE[t].label) + ' <b>' + fmt(counts[t]) + '</b>' + (DATA.tips && DATA.tips[t] ? tipI(DATA.tips[t]) : "") + '</button>';
  });
  if (focus) html += '<button class="fchip active" data-focus="1">' + esc(TAG_STYLE[focus.id] ? TAG_STYLE[focus.id].label : "Selected") + ' <b>' + fmt(focus.iids.size) + '</b> ✕</button>';
  html += '<span class="spacer"></span><label class="inst-l">Institute name <input class="search" id="inst" list="instList" placeholder="Type or pick an institute" value="' + esc(searchText) + '"></label>' +
          '<datalist id="instList">' + all.map(a => '<option value="' + esc(a.name) + '">').join("") + '</datalist>' +
          (searchText ? '<button class="btn" id="instClear" title="Clear">✕</button>' : "") +
          '<button class="btn" id="exportBtn">⬇ Export</button>';
  el.innerHTML = html;
  el.querySelectorAll(".fchip").forEach(b => b.onclick = e => {
    if (e.target.closest(".ti")) return; // the ⓘ only explains, it does not filter
    if (b.dataset.focus){ focus = null; }
    else { filterTag = b.dataset.tag || null; focus = null; }
    shown = CONFIG.PAGE_SIZE; renderLines(); renderFilters(); renderTable();
  });
  const inp = document.getElementById("inst");
  inp.oninput = () => { searchText = inp.value; shown = CONFIG.PAGE_SIZE; renderTable(); };
  inp.onchange = () => { renderFilters(); document.getElementById("inst").focus(); };
  const ic = document.getElementById("instClear");
  if (ic) ic.onclick = () => { searchText = ""; shown = CONFIG.PAGE_SIZE; renderFilters(); renderTable(); };
  document.getElementById("exportBtn").onclick = exportAccounts;
}

function filteredAccounts(){
  const q = searchText.trim().toLowerCase();
  // "See" on an insight line can reach accounts on the other side (e.g. an admin-quiet strong account), so focus searches all
  const base = focus ? DATA.accounts.filter(a => focus.iids.has(a.iid)) : sideAccounts();
  const out = base.filter(a =>
    (!filterTag || (filterTag === "key_user" ? a.keyUserQuiet : shownTag(a) === filterTag)) &&
    (!q || a.name.toLowerCase().indexOf(q) !== -1));
  if (!sortKey) return out;
  const val = a => sortKey === "health" ? ((TAG_STYLE[shownTag(a)] || {}).label || a.tag)
    : sortKey === "name" ? a.name.toLowerCase() : sortKey === "iid" ? Number(a.iid) : (a[sortKey] == null ? -1 : a[sortKey]);
  return out.slice().sort((x, y) => { const p = val(x), r = val(y); return (p < r ? -1 : p > r ? 1 : 0) * sortDir; });
}

function renderTable(){
  const list = filteredAccounts();
  const tb = document.getElementById("tbody");
  let html = "";
  list.slice(0, shown).forEach((a, i) => {
    const open = openRows.has(a.iid), t = shownTag(a);
    html += '<tr class="row' + (open ? " open" : "") + '" data-iid="' + esc(a.iid) + '">' +
      '<td class="rank">' + (i + 1) + '</td><td class="why">' + esc(a.iid) + '</td>' +
      '<td class="acct"><span class="caret">▸</span>' + esc(a.name) + '</td>' +
      '<td>' + pill(t) + '</td>' +
      '<td class="why hide-sm">' + esc(t === "key_user" ? "Regular admin had no activity in " + DATA.monthShort : a.why) + '</td>' +
      '<td>' + zonePill(a) + '</td>' +
      '<td class="num">' + fmt(a.seats) + '</td><td class="num">' + fmt(a.enabled) + '</td><td class="num">' + fmt(a.active) + '</td></tr>';
    if (open) html += '<tr class="people"><td colspan="9" id="ppl-' + esc(a.iid) + '">' + peopleHtml(a) + '</td></tr>';
  });
  if (!list.length) html = '<tr><td colspan="9" class="why" style="text-align:center;padding:24px">No accounts match.</td></tr>';
  tb.innerHTML = html;
  tb.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => toggleRow(tr.dataset.iid));
  tb.querySelectorAll("[data-export-people]").forEach(b => b.onclick = ev => { ev.stopPropagation(); exportPeople(b.dataset.exportPeople); });

  const more = document.getElementById("more");
  const left = list.length - shown;
  more.innerHTML = left > 0
    ? '<button class="btn" id="moreBtn">+ ' + fmt(left) + ' account' + (left === 1 ? "" : "s") + ' more</button>'
    : (list.length > CONFIG.PAGE_SIZE ? '<button class="btn" id="lessBtn">Show fewer</button>' : "");
  const mb = document.getElementById("moreBtn");
  if (mb) mb.onclick = () => { shown = list.length; renderTable(); };
  const lb = document.getElementById("lessBtn");
  if (lb) lb.onclick = () => { shown = CONFIG.PAGE_SIZE; renderTable(); document.getElementById("healthCard").scrollIntoView({ block: "start" }); };
}

function peopleHtml(a){
  const p = peopleCache[a.iid];
  if (p === undefined) return '<span class="why">Loading users…</span>';
  if (p === null) return '<span class="why">Could not load users.</span>';
  if (p === "demo-missing") return '<span class="why">User lists are not part of this preview.</span>';
  if (!p.length) return '<span class="why">No idle or dormant users. Everyone licensed was active.</span>';
  const idle = p.filter(x => x.state === "idle").length, dormant = p.length - idle;
  return '<div class="people-head"><b style="color:var(--text)">' + fmt(idle) + ' idle</b> (no activity last month) · <b style="color:var(--text)">' +
    fmt(dormant) + ' dormant</b> (never active)<span class="spacer"></span>' +
    '<button class="btn" data-export-people="' + esc(a.iid) + '">⬇ Export users</button></div>' +
    '<div class="people-list">' + p.map(x => '<div>' + esc(x.name || "User " + x.uid) +
      ' <span class="p-state">· ' + esc(x.state) + ' · ' + esc(x.uid) + '</span></div>').join("") + '</div>';
}

async function toggleRow(iid){
  if (openRows.has(iid)){ openRows.delete(iid); renderTable(); return; }
  openRows.add(iid);
  renderTable();
  if (peopleCache[iid] !== undefined) return;
  try {
    if (P.demo){
      const demo = await loadDemo();
      peopleCache[iid] = (demo.people && demo.people[iid]) || "demo-missing";
    } else {
      const r = await api({ action: "people", iid });
      peopleCache[iid] = r && !r.error ? r.people : null;
    }
  } catch(e){ peopleCache[iid] = null; }
  if (document.getElementById("ppl-" + iid)) renderTable();
}

/* ================= EXPORT / SHARE ================= */
function csvCell(v){ const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function download(name, rows){
  const blob = new Blob(["﻿" + rows.map(r => r.map(csvCell).join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportAccounts(){
  const rows = [["S.No", "Institute ID", "Institute name", "Health", "Why", "Seat use %", "Seats", "Enabled", "Active", "Idle users", "Dormant users"]];
  filteredAccounts().forEach((a, i) => rows.push([i + 1, a.iid, a.name, (TAG_STYLE[shownTag(a)] || {}).label || a.tag, a.why,
    a.pct == null ? "" : a.pct, a.seats, a.enabled, a.active, a.idle, a.dormant]));
  download("users-insights-" + side + "-" + DATA.month.replace(/\s+/g, "-") + ".csv", rows);
}
function exportPeople(iid){
  const a = DATA.accounts.find(x => x.iid === iid);
  const rows = [["Institute ID", "Account", "User ID", "User name", "State"]];
  (Array.isArray(peopleCache[iid]) ? peopleCache[iid] : []).forEach(p => rows.push([iid, a ? a.name : "", p.uid, p.name, p.state]));
  download("idle-users-" + iid + ".csv", rows);
}
function copySummary(){
  const d = DATA;
  const block = sd => (d.spotlight || []).filter(b => b.side === sd).map(b => "• " + b.text).join("\n");
  const text = "Users insights · " + d.month + (d.verdict ? "\n" + d.verdict : "") +
    "\n\nPositives\n" + (block("strong") || "• Nothing to call out") +
    "\n\nNegatives\n" + (d.dataSuspect ? "• Data looks incomplete this month" : (block("weak") || "• Nothing critical")) + "\n\n(Pulse 2.0)";
  const done = () => { const b = document.getElementById("copyBtn"); b.textContent = "Copied ✓"; setTimeout(() => b.textContent = "Copy summary", 1800); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); done(); } catch(e){}
  t.remove();
}
</script>
